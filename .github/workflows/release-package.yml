name: Paquete de instalación

# Adjunta a cada Release el paquete listo para usar (sin código fuente): fluxa, compose y .env.example
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Armar paquete
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          node cli/package.mjs "$VERSION"
          cd release
          zip -qr "fluxa-$VERSION.zip" "fluxa-$VERSION"
          tar -czf "fluxa-$VERSION.tar.gz" "fluxa-$VERSION"
          sha256sum "fluxa-$VERSION.zip" "fluxa-$VERSION.tar.gz" > "fluxa-$VERSION.sha256"

      - name: Subir al Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          gh release upload "$TAG" release/fluxa-$VERSION.zip release/fluxa-$VERSION.tar.gz release/fluxa-$VERSION.sha256 --clobber
